<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Enxoval da Alana · cadastro no Styli</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#fdf7f9;color:#2a2a2a}
header{position:sticky;top:0;z-index:5;background:#f4c7d4;padding:10px 12px;box-shadow:0 1px 4px #0002}
h1{margin:0;font-size:17px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px;font-size:13px}
#nome{padding:6px 8px;border:1px solid #c98ea0;border-radius:8px;width:150px;font-size:14px}
.bar{height:8px;background:#fff;border-radius:6px;overflow:hidden;flex:1;min-width:120px}.bar i{display:block;height:100%;background:#c2185b;width:0}
.sync{font-size:12px;padding:2px 8px;border-radius:10px;background:#fff}.sync.on{background:#d7f5dd}.sync.off{background:#ffe3c2}
main{max-width:720px;margin:auto;padding:8px 10px 60px}h2{font-size:16px;margin:20px 0 6px}
.card{background:#fff;border-radius:12px;padding:12px;margin:10px 0;box-shadow:0 1px 3px #0001;border-left:5px solid transparent}
.card.fazendo{border-left-color:#f0a020}.card.feito{opacity:.55;border-left-color:#2e9e4f}
.top{display:flex;gap:6px;font-size:11px;align-items:center}.id{color:#888;font-weight:700}.pr{border-radius:8px;padding:0 6px}
.p-Ess{background:#ffd9a8}.p-Úti{background:#d6ecff}.p-Opc{background:#eee}.ent{margin-left:auto;color:#666}
img{display:block;width:100%;max-height:240px;object-fit:contain;margin:6px 0}
.f{display:flex;align-items:center;gap:8px;border-top:1px solid #f1e4e8;padding:6px 0}.k{width:80px;flex:none;font-size:12px;color:#888}
.v{flex:1;min-width:0;font-size:14px;overflow-wrap:anywhere}
button{background:#c2185b;color:#fff;border:0;border-radius:8px;padding:7px 11px;font-size:14px}
button.sec{background:#555}button.ok{background:#2e9e4f}button.wip{background:#f0a020}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.st{font-size:13px;margin-top:6px;font-weight:600}
.obs{font-size:12px;color:#7a5a63;margin-top:4px}label.fl{font-size:13px}
</style></head><body>
<header><h1>Enxoval da Alana · cadastro no Styli</h1>
<div class="row">Seu nome: <input id="nome" maxlength="40" placeholder="ex.: Ana"><span id="sync" class="sync off">Conectando…</span></div>
<div class="row"><div class="bar"><i id="barra"></i></div><span id="cont"></span>
<label class="fl"><input type="checkbox" id="esconder"> esconder cadastrados</label></div></header>
<main id="lista"><p>Carregando…</p></main>
<script src="config.js"></script>
<script type="module">
const $=s=>document.querySelector(s); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let estado={}; let salvarEstado=async()=>{}; let ITENS=[], CATS=[];
const nomeEl=$('#nome'); try{nomeEl.value=localStorage.getItem('alana-nome')||''}catch(e){}
nomeEl.onchange=()=>{try{localStorage.setItem('alana-nome',nomeEl.value.trim())}catch(e){}};
$('#esconder').onchange=render;

function campo(rot,val){if(val===''||val==null)return'';return `<div class="f"><span class="k">${rot}</span><span class="v">${esc(val)}</span><button data-copy="${esc(val)}">Copiar</button></div>`}
function card(it){const s=estado[it.id];const cls=s?s.status:'';
 const st=s?(s.status==='feito'?`✅ Cadastrado por ${esc(s.por)}`:`⏳ ${esc(s.por)} está cadastrando`):'';
 return `<div class="card ${cls}" id="${it.id}"><div class="top"><span class="id">${it.id}</span><span class="pr p-${it.prio.slice(0,3)}">${it.prio}</span><span class="ent">Entrega ${esc(it.entrega)}</span></div>
 <img src="fotos/${it.id}.jpg" alt="${esc(it.nome)}" loading="lazy">
 <div class="acts"><button class="sec" data-foto="${it.id}">Salvar foto</button></div>
 ${campo('Nome',it.nome)}${campo('Preço',it.preco)}${campo('Quantidade',it.qtd)}${campo('Tamanho',it.tam)}${campo('Material',it.mat)}${campo('Loja',it.loja)}${campo('Link',it.link)}
 <div class="obs">${esc(it.obs)}</div><div class="st">${st}</div>
 <div class="acts"><button class="wip" data-st="fazendo" data-id="${it.id}">${s&&s.status==='fazendo'?'Desmarcar':'Estou cadastrando'}</button>
 <button class="ok" data-st="feito" data-id="${it.id}">${s&&s.status==='feito'?'Desfazer':'Já cadastrei no Styli'}</button></div></div>`}
function render(){const hide=$('#esconder').checked;let html='';
 for(const c of CATS){const xs=ITENS.filter(i=>i.cat===c&&!(hide&&estado[i.id]?.status==='feito'));if(!xs.length)continue;
  html+=`<h2>${esc(c)} <small>(${xs.length})</small></h2>`+xs.map(card).join('')}
 $('#lista').innerHTML=html||'<p>Tudo cadastrado! 🎉</p>';
 const n=ITENS.filter(i=>estado[i.id]?.status==='feito').length;$('#cont').textContent=`${n} de ${ITENS.length}`;$('#barra').style.width=(100*n/ITENS.length)+'%'}

document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.copy!==undefined){const t=b.textContent;try{await navigator.clipboard.writeText(b.dataset.copy);b.textContent='Copiado!'}catch(_){const r=document.createRange();r.selectNodeContents(b.previousElementSibling);getSelection().removeAllRanges();getSelection().addRange(r);b.textContent='Copie o marcado'}setTimeout(()=>b.textContent=t,1500);return}
 if(b.dataset.foto){const id=b.dataset.foto,url=`fotos/${id}.jpg`;try{const blob=await (await fetch(url)).blob();const file=new File([blob],`${id}.jpg`,{type:'image/jpeg'});
   if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return}}catch(err){if(err&&err.name==='AbortError')return}
  const a=document.createElement('a');a.href=url;a.download=`${id}.jpg`;document.body.appendChild(a);a.click();a.remove();return}
 if(b.dataset.st){const nome=nomeEl.value.trim();if(!nome){nomeEl.focus();nomeEl.style.outline='3px solid #c2185b';return}
  const id=b.dataset.id,atual=estado[id];const novo=(atual&&atual.status===b.dataset.st)?null:{status:b.dataset.st,por:nome,em:Date.now()};
  b.disabled=true;try{await salvarEstado(id,novo)}catch(err){alert('Não consegui salvar: '+err.message)}b.disabled=false}});

const dados=await (await fetch('itens.json')).json();ITENS=dados.itens;CATS=dados.cats;render();

const sync=$('#sync');
if(window.FIREBASE_CONFIG){
 try{const V='10.12.2';
  const {initializeApp}=await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
  const {getDatabase,ref,onValue,set,remove,serverTimestamp}=await import(`https://www.gstatic.com/firebasejs/${V}/firebase-database.js`);
  const db=getDatabase(initializeApp(window.FIREBASE_CONFIG));
  salvarEstado=(id,v)=>v?set(ref(db,'enxoval/'+id),{...v,em:serverTimestamp()}):remove(ref(db,'enxoval/'+id));
  onValue(ref(db,'.info/connected'),s=>{sync.textContent=s.val()?'Sincronizado':'Sem conexão…';sync.className='sync '+(s.val()?'on':'off')});
  onValue(ref(db,'enxoval'),s=>{estado=s.val()||{};render()},err=>{sync.textContent='Erro: '+err.message;sync.className='sync off'});
 }catch(err){sync.textContent='Erro ao conectar: '+err.message}
}else{
 sync.textContent='Só neste aparelho (sincronização ainda não ligada)';
 try{estado=JSON.parse(localStorage.getItem('alana-estado')||'{}')}catch(e){}
 salvarEstado=async(id,v)=>{if(v)estado[id]=v;else delete estado[id];try{localStorage.setItem('alana-estado',JSON.stringify(estado))}catch(e){}render()};render();
}
</script></body></html>
